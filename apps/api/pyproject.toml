[project]
name = "respio-api"
version = "0.1.27"
description = "Respio FastAPI backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi[standard]==0.141.1",
  "starlette==1.3.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy[asyncio]==2.0.45",
  "alembic==1.17.2",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "orjson==3.12.0",
  "structlog==25.5.0",
  "cryptography==50.0.1",
  "PyJWT==2.15.0",
  "pwdlib[argon2]==0.3.0",
  "email-validator==2.3.0",
  "dramatiq[redis]==2.2.0",
  "redis>=6.2,<9.0",
  "sentry-sdk[fastapi]==2.48.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pip-audit==2.10.1",
  "respx==0.22.0",
  "ruff==0.14.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ai/prompt_strategy.py" = ["RUF001"]
"app/api/auth.py" = ["RUF001"]
"app/safety/safety_gate.py" = ["RUF001"]
"app/services/transactional_email.py" = ["RUF001"]
"app/tests/test_auth_email_flows.py" = ["RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app"]
