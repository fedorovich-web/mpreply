services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: respio
      POSTGRES_USER: respio
      POSTGRES_PASSWORD: respio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respio -d respio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-bookworm
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../apps/api
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://respio:respio_password@postgres:5432/respio
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../../apps/web
    env_file:
      - ../../.env.example
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
