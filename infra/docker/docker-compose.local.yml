name: mpreply-local

x-backend-env: &backend-env
  APP_ENV: local
  APP_NAME: MPReply
  APP_VERSION: 0.1.103
  API_BASE_URL: http://localhost:8000
  WEB_APP_URL: http://localhost:3000
  PUBLIC_SITE_URL: http://localhost:3000
  DATABASE_URL: postgresql+asyncpg://mpreply:mpreply_password@postgres:5432/mpreply
  REDIS_URL: redis://redis:6379/0
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-secret-change-before-production-000000000000}
  AUTH_ACCESS_TOKEN_TTL_MINUTES: "15"
  AUTH_REFRESH_TOKEN_TTL_DAYS: "30"
  AUTH_INVITATION_TTL_HOURS: "72"
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAMESITE: lax
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-replace-only-in-real-env}
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_DEFAULT_MODEL: openai/gpt-5.2
  OPENROUTER_FALLBACK_MODEL: anthropic/claude-sonnet-4.6
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
  PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:3000/app/billing?payment=return}
  PAYMENT_PROVIDER_TIMEOUT_SECONDS: ${PAYMENT_PROVIDER_TIMEOUT_SECONDS:-20}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-replace-only-in-real-env}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-replace-only-in-real-env}
  YOOKASSA_API_BASE_URL: ${YOOKASSA_API_BASE_URL:-https://api.yookassa.ru/v3}
  PAYMENT_WEBHOOK_IP_CHECK_ENABLED: ${PAYMENT_WEBHOOK_IP_CHECK_ENABLED:-true}
  PAYMENT_WEBHOOK_MAX_BODY_BYTES: ${PAYMENT_WEBHOOK_MAX_BODY_BYTES:-65536}
  YOOKASSA_WEBHOOK_ALLOWED_NETWORKS: '${YOOKASSA_WEBHOOK_ALLOWED_NETWORKS:-["185.71.76.0/27","185.71.77.0/27","77.75.153.0/25","77.75.156.11/32","77.75.156.35/32","77.75.154.128/25","2a02:5180::/32"]}'
  PAYMENT_TRUSTED_PROXY_NETWORKS: '${PAYMENT_TRUSTED_PROXY_NETWORKS:-[]}'
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: "0.0"
  LOG_LEVEL: INFO
  CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
  ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver","api"]'
  READINESS_TIMEOUT_SECONDS: "3.0"
  SECURITY_HEADERS_ENABLED: "true"
  ANSWER_RESERVATION_TTL_SECONDS: "900"
  MARKETPLACE_SYNC_INTERVAL_SECONDS: "300"
  SCHEDULER_POLL_INTERVAL_SECONDS: "10"
  SCHEDULER_CLAIM_LIMIT: "50"
  SCHEDULER_LEASE_SECONDS: "180"
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  DEPLOYMENT_VERSION: local

services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: mpreply
      POSTGRES_USER: mpreply
      POSTGRES_PASSWORD: mpreply_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpreply -d mpreply"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.4.0-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        DEPLOYMENT_VERSION: local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
