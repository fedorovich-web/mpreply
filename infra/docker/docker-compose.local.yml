name: respio-local

x-backend-env: &backend-env
  APP_ENV: local
  APP_NAME: MPReply
  APP_VERSION: 0.1.27
  API_BASE_URL: http://localhost:8000
  WEB_APP_URL: http://localhost:3000
  PUBLIC_SITE_URL: http://localhost:3000
  DATABASE_URL: postgresql+asyncpg://respio:respio_password@postgres:5432/respio
  REDIS_URL: redis://redis:6379/0
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-secret-change-before-production-000000000000}
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAMESITE: lax
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
  GROQ_API_KEY: ${GROQ_API_KEY:-replace-only-in-real-env}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_DEFAULT_MODEL: ${GROQ_DEFAULT_MODEL:-qwen/qwen3.8-27b}
  GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-45}
  AI_REPLY_PROVIDER: ${AI_REPLY_PROVIDER:-groq}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-45}
  WB_SERVICE_SECRET: ${WB_SERVICE_SECRET:-}
  WB_INTEGRATION_MODE: ${WB_INTEGRATION_MODE:-cloud}
  WB_SELF_HOSTED_SELLER_HASH: ${WB_SELF_HOSTED_SELLER_HASH:-}
  LAVA_ENABLED: ${LAVA_ENABLED:-false}
  LAVA_API_KEY: ${LAVA_API_KEY:-}
  LAVA_PRODUCT_ID: ${LAVA_PRODUCT_ID:-}
  LAVA_OFFER_ID: ${LAVA_OFFER_ID:-}
  LAVA_WEBHOOK_SECRET: ${LAVA_WEBHOOK_SECRET:-}
  YANDEX_OAUTH_ENABLED: ${YANDEX_OAUTH_ENABLED:-false}
  YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
  YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: "0.0"
  LOG_LEVEL: INFO
  CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
  ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver","api"]'
  READINESS_TIMEOUT_SECONDS: "3.0"
  SECURITY_HEADERS_ENABLED: "true"
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  DEPLOYMENT_VERSION: local
  MARKETPLACE_SCHEDULER_INTERVAL_SECONDS: ${MARKETPLACE_SCHEDULER_INTERVAL_SECONDS:-30}
  MARKETPLACE_SCHEDULER_BATCH_SIZE: ${MARKETPLACE_SCHEDULER_BATCH_SIZE:-25}

services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: respio
      POSTGRES_USER: respio
      POSTGRES_PASSWORD: respio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U respio -d respio"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.4.0-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  scheduler:
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        DEPLOYMENT_VERSION: local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
