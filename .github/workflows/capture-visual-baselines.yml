name: Capture visual candidates

on:
    push:
        branches: [codex/mpreply-blue-public-redesign]

permissions:
    contents: read

jobs:
    capture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Install Playwright Chromium
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Generate Linux visual candidates
              working-directory: apps/web
              run: npm run test:visual:update
            - name: Upload visual candidates
              uses: actions/upload-artifact@v4
              with:
                  name: visual-candidates
                  path: apps/web/e2e/visual.spec.ts-snapshots
                  if-no-files-found: error
