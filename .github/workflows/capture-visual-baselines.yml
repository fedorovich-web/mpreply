name: Capture visual baselines

on:
    push:
        branches: [codex/mpreply-blue-public-redesign]

permissions:
    contents: write

jobs:
    capture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Install Playwright Chromium
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Generate reviewed Linux visual baselines
              working-directory: apps/web
              run: npm run test:visual:update
            - name: Commit visual baselines
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add apps/web/e2e/visual.spec.ts-snapshots
                  if git diff --cached --quiet; then
                    echo "No visual baseline changes to commit."
                    exit 0
                  fi
                  git commit -m "test: add reviewed visual regression baselines"
                  git push origin HEAD:codex/mpreply-blue-public-redesign