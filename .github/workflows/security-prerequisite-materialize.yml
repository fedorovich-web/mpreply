name: Materialize security prerequisite

on:
  push:
    branches:
      - work/0.1.104-security-prerequisite-clean

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/0.1.104-security-prerequisite-clean
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wire security contracts into repository and container build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          integrity_path = Path('scripts/check_integrity.py')
          integrity = integrity_path.read_text(encoding='utf-8')
          import_token = 'from brace_expansion_security import check_brace_expansion_security'
          if import_token not in integrity:
              marker = 'from pathlib import Path\n'
              if marker not in integrity:
                  raise SystemExit('check_integrity import anchor is missing')
              integrity = integrity.replace(marker, marker + '\n' + import_token + '\n', 1)
          call_token = '    check_brace_expansion_security(ROOT, fail)\n'
          if call_token not in integrity:
              marker = '    check_versions_and_frontend_security_baseline()\n'
              if marker not in integrity:
                  raise SystemExit('check_integrity call anchor is missing')
              integrity = integrity.replace(marker, marker + call_token, 1)
          integrity_path.write_text(integrity, encoding='utf-8')

          docker_path = Path('apps/web/Dockerfile')
          dockerfile = docker_path.read_text(encoding='utf-8')
          copy_token = (
              'COPY vendor/npm/brace-expansion-5.0.8-mpreply-compat '
              './vendor/npm/brace-expansion-5.0.8-mpreply-compat\n'
          )
          if copy_token not in dockerfile:
              marker = 'COPY package.json package-lock.json ./\n'
              if marker not in dockerfile:
                  raise SystemExit('Dockerfile dependency-copy anchor is missing')
              dockerfile = dockerfile.replace(marker, marker + copy_token, 1)
          docker_path.write_text(dockerfile, encoding='utf-8')
          PY

      - name: Generate synchronized lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Verify exact materialized scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              'apps/web/Dockerfile',
              'apps/web/package-lock.json',
              'scripts/check_integrity.py',
          }
          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f'unexpected materialized scope: {sorted(actual)}')
          PY
          git diff --check

      - name: Verify generated security baseline
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/check_integrity.py

      - name: Commit materialized files and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/security-prerequisite-materialize.yml
          git add -- apps/web/Dockerfile apps/web/package-lock.json scripts/check_integrity.py
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(security): materialize patched dependency lock'
          git push origin HEAD:refs/heads/work/0.1.104-security-prerequisite-clean

      - name: Validate clean install and security audit
        working-directory: apps/web
        run: |
          npm ci
          npm ls --all
          npm audit --audit-level=high
          npm run test:unit
          npm run typecheck
          npm run lint
