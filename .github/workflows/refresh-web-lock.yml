name: Refresh web lockfile

on:
  push:
    branches:
      - chore/groq-provider-migration

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/groq-provider-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh secure frontend dependency lock
        working-directory: apps/web
        run: |
          npm install --save-exact next@16.3.4
          npm install --save-dev --save-exact eslint-config-next@16.3.4 vitest@4.1.11
          npm pkg set overrides.postcss=8.5.28
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh secure frontend dependencies"
          git push origin HEAD:chore/groq-provider-migration
