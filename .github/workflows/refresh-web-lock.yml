name: Refresh web lockfile

on:
  push:
    branches:
      - chore/groq-provider-migration

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/groq-provider-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh lockfile from pinned package manifest
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify production dependency audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh secure frontend lockfile"
          git push origin HEAD:chore/groq-provider-migration
