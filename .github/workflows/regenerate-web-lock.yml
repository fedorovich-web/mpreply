name: Regenerate frontend lockfile

on:
  push:
    branches:
      - chore/groq-provider-migration

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/groq-provider-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Show project package manager versions
        run: |
          node --version
          npm --version
      - name: Regenerate lockfile from the pinned package manifest
        working-directory: apps/web
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify clean install
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Verify production dependency audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the project npm resolver."
            exit 0
          fi
          git commit -m "chore: regenerate frontend lockfile with npm 10"
          git push origin HEAD:chore/groq-provider-migration
