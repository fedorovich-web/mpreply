name: Finalize Vitest baseline

on:
  push:
    branches:
      - chore/groq-provider-migration

permissions:
  contents: write

jobs:
  finalize-vitest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/groq-provider-migration
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Synchronize integrity baseline
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/check_integrity.py")
          text = path.read_text(encoding="utf-8")
          old = '("devDependencies", "vitest"): "4.1.11"'
          new = '("devDependencies", "vitest"): "5.0.0"'
          if old in text:
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Vitest integrity baseline token was not found")
      - name: Verify repository integrity
        run: python scripts/check_integrity.py
      - name: Verify Vitest 5 unit suites
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run test:unit
          npm run test:design-tokens
      - name: Commit synchronized baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_integrity.py
          if git diff --cached --quiet; then
            echo "Integrity baseline already synchronized."
            exit 0
          fi
          git commit -m "chore: align integrity baseline with Vitest 5"
          git push origin HEAD:chore/groq-provider-migration
