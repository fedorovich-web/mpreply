name: Security prerequisite bootstrap

on:
  pull_request:
    branches:
      - work/0.1.104-security-prerequisite

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: security-prerequisite-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-lockfile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply exact lockfile and integrity patch
        run: |
          git apply --check .github/bootstrap/security-prerequisite.patch
          git apply .github/bootstrap/security-prerequisite.patch
          git diff --check

      - name: Repository tooling regression tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Repository integrity
        run: python scripts/check_integrity.py

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Complete dependency tree
        working-directory: apps/web
        run: npm ls --all

      - name: Frontend unit tests
        working-directory: apps/web
        run: npm run test:unit

      - name: Security audit
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Design token tests
        working-directory: apps/web
        run: npm run test:design-tokens

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Impeccable design anti-pattern scan
        working-directory: apps/web
        run: npm run design:detect

      - name: CSS syntax validation
        working-directory: apps/web
        run: npm run validate:css-syntax

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: W3C HTML and CSS validation
        working-directory: apps/web
        run: npm run validate:w3c

      - name: Commit validated security baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-prerequisite-bootstrap.yml
          git rm .github/bootstrap/security-prerequisite.patch
          git rm .github/bootstrap/security-bootstrap-trigger.txt
          git add apps/web/package-lock.json scripts/check_integrity.py
          git diff --cached --check
          git commit -m "chore(security): finalize brace expansion baseline"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
