name: Security current prerequisite materializer

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: security-current-prerequisite-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'work/0.1.104-security-current' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/0.1.104-security-current
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Pin npm toolchain
        shell: bash
        run: npm install --global npm@11.17.0

      - name: Write failing transitive-security regression contract
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/tests/test_frontend_transitive_security_baseline.py <<'PY'
          from __future__ import annotations

          import json
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          SECURITY_MINIMUMS: dict[str, dict[int, tuple[int, int, int]]] = {
              "brace-expansion": {
                  1: (1, 1, 18),
                  2: (2, 1, 4),
                  3: (3, 0, 6),
                  5: (5, 0, 9),
              },
              "postcss": {8: (8, 5, 23)},
              "ip-address": {10: (10, 3, 1)},
              "js-yaml": {
                  3: (3, 15, 1),
                  4: (4, 3, 1),
                  5: (5, 2, 1),
              },
              "nanoid": {
                  3: (3, 3, 17),
                  5: (5, 1, 6),
              },
              "undici": {
                  6: (6, 28, 0),
                  7: (7, 29, 0),
                  8: (8, 9, 0),
              },
          }


          def parse_semver(value: object) -> tuple[int, int, int] | None:
              if not isinstance(value, str):
                  return None
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if match is None:
                  return None
              return tuple(int(part) for part in match.groups())


          class FrontendTransitiveSecurityBaselineTests(unittest.TestCase):
              def test_lockfile_contains_only_patched_transitive_versions(self) -> None:
                  lock = json.loads(
                      (ROOT / "apps" / "web" / "package-lock.json").read_text(
                          encoding="utf-8"
                      )
                  )
                  packages = lock.get("packages", {})

                  for package_name, floors in SECURITY_MINIMUMS.items():
                      found: list[tuple[str, tuple[int, int, int]]] = []
                      suffix = f"node_modules/{package_name}"
                      for path, metadata in packages.items():
                          if not isinstance(path, str) or not isinstance(metadata, dict):
                              continue
                          if path != suffix and not path.endswith(f"/{suffix}"):
                              continue
                          version = parse_semver(metadata.get("version"))
                          self.assertIsNotNone(
                              version,
                              msg=f"{package_name} has a non-semver lock entry at {path}",
                          )
                          assert version is not None
                          found.append((path, version))
                          floor = floors.get(version[0])
                          self.assertIsNotNone(
                              floor,
                              msg=(
                                  f"{package_name} major {version[0]} has no approved "
                                  f"security line at {path}"
                              ),
                          )
                          assert floor is not None
                          self.assertGreaterEqual(
                              version,
                              floor,
                              msg=(
                                  f"{package_name} {'.'.join(map(str, version))} at {path} "
                                  f"is below patched floor {'.'.join(map(str, floor))}"
                              ),
                          )
                      self.assertTrue(found, msg=f"{package_name} is missing from package-lock.json")

              def test_integrity_checker_enforces_current_security_floors(self) -> None:
                  checker = (ROOT / "scripts" / "check_integrity.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertIn("FRONTEND_SECURITY_MINIMUMS", checker)
                  self.assertIn('("overrides", "postcss"): "8.5.23"', checker)
                  self.assertNotIn('("overrides", "postcss"): "8.5.18"', checker)


          if __name__ == "__main__":
              unittest.main()
          PY

          if python -m unittest scripts.tests.test_frontend_transitive_security_baseline; then
            echo 'Expected RED failure, but the vulnerable baseline unexpectedly passed.' >&2
            exit 1
          fi
          echo 'RED verified: the baseline lockfile is below current patched floors.'

      - name: Apply current security contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()

          package_path = root / "apps" / "web" / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          overrides = package.setdefault("overrides", {})
          if overrides.get("postcss") != "8.5.18":
              raise SystemExit(
                  f"Unexpected PostCSS baseline: {overrides.get('postcss')!r}"
              )
          overrides["postcss"] = "8.5.23"
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          checker_path = root / "scripts" / "check_integrity.py"
          checker = checker_path.read_text(encoding="utf-8")
          old_postcss = '("overrides", "postcss"): "8.5.18"'
          new_postcss = '("overrides", "postcss"): "8.5.23"'
          if checker.count(old_postcss) != 1:
              raise SystemExit("Unexpected PostCSS integrity anchor count")
          checker = checker.replace(old_postcss, new_postcss)

          constants_anchor = 'EXPECTED_ALEMBIC_HEAD = "20260722_0014"\n'
          constants = '''EXPECTED_ALEMBIC_HEAD = "20260722_0014"\n\nFRONTEND_SECURITY_MINIMUMS: dict[str, dict[int, tuple[int, int, int]]] = {\n    "brace-expansion": {\n        1: (1, 1, 18),\n        2: (2, 1, 4),\n        3: (3, 0, 6),\n        5: (5, 0, 9),\n    },\n    "postcss": {8: (8, 5, 23)},\n    "ip-address": {10: (10, 3, 1)},\n    "js-yaml": {\n        3: (3, 15, 1),\n        4: (4, 3, 1),\n        5: (5, 2, 1),\n    },\n    "nanoid": {\n        3: (3, 3, 17),\n        5: (5, 1, 6),\n    },\n    "undici": {\n        6: (6, 28, 0),\n        7: (7, 29, 0),\n        8: (8, 9, 0),\n    },\n}\n'''
          if checker.count(constants_anchor) != 1:
              raise SystemExit("Unexpected integrity constants anchor count")
          checker = checker.replace(constants_anchor, constants, 1)

          helper_anchor = '''def _is_text_source(path: Path) -> bool:\n    return path.suffix.lower() in TEXT_SOURCE_SUFFIXES or ".env" in path.name.lower()\n\n\n'''
          helper = '''def _is_text_source(path: Path) -> bool:\n    return path.suffix.lower() in TEXT_SOURCE_SUFFIXES or ".env" in path.name.lower()\n\n\ndef _parse_semver(value: object) -> tuple[int, int, int] | None:\n    if not isinstance(value, str):\n        return None\n    match = re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)", value)\n    if match is None:\n        return None\n    return tuple(int(part) for part in match.groups())\n\n\n'''
          if checker.count(helper_anchor) != 1:
              raise SystemExit("Unexpected integrity helper anchor count")
          checker = checker.replace(helper_anchor, helper, 1)

          lock_anchor = '    lock_packages = lock.get("packages", {})\n'
          lock_checks = '''    lock_packages = lock.get("packages", {})\n    for package_name, floors in FRONTEND_SECURITY_MINIMUMS.items():\n        found_versions: list[tuple[str, tuple[int, int, int]]] = []\n        suffix = f"node_modules/{package_name}"\n        for path, metadata in lock_packages.items():\n            if not isinstance(path, str) or not isinstance(metadata, dict):\n                continue\n            if path != suffix and not path.endswith(f"/{suffix}"):\n                continue\n            version = _parse_semver(metadata.get("version"))\n            if version is None:\n                fail(f"{package_name} has a non-semver lock entry at {path}")\n                continue\n            found_versions.append((path, version))\n            floor = floors.get(version[0])\n            if floor is None:\n                fail(\n                    f"{package_name} major {version[0]} has no approved security line at {path}"\n                )\n                continue\n            if version < floor:\n                fail(\n                    f"{package_name} {'.'.join(map(str, version))} at {path} is below "\n                    f"patched floor {'.'.join(map(str, floor))}"\n                )\n        if not found_versions:\n            fail(f"{package_name} is missing from apps/web/package-lock.json")\n'''
          if checker.count(lock_anchor) != 1:
              raise SystemExit("Unexpected lock-package integrity anchor count")
          checker = checker.replace(lock_anchor, lock_checks, 1)
          checker_path.write_text(checker, encoding="utf-8")

          postcss_test_path = root / "scripts" / "tests" / "test_postcss_security_baseline.py"
          postcss_test = postcss_test_path.read_text(encoding="utf-8")
          if postcss_test.count('EXPECTED_POSTCSS_VERSION = "8.5.18"') != 1:
              raise SystemExit("Unexpected PostCSS regression-test anchor count")
          postcss_test = postcss_test.replace(
              'EXPECTED_POSTCSS_VERSION = "8.5.18"',
              'EXPECTED_POSTCSS_VERSION = "8.5.23"',
          )
          postcss_test = postcss_test.replace(
              '("overrides", "postcss"): "8.5.18"',
              '("overrides", "postcss"): "8.5.23"',
          )
          postcss_test_path.write_text(postcss_test, encoding="utf-8")
          PY

      - name: Update only affected transitive dependency lines
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm update brace-expansion postcss ip-address js-yaml nanoid undici \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      - name: Verify dependency tree and current audit
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ls --all
          npm audit --audit-level=high

      - name: Verify security and frontend gates before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_frontend_transitive_security_baseline
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/check_integrity.py
          cd apps/web
          npm run test:frontend
          npm run typecheck
          npm run lint
          npm run design:detect
          npm run validate:css-syntax
          npm run build
          npm run validate:w3c

      - name: Write sanitized verification evidence
        shell: bash
        env:
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          lock = json.loads(
              (root / "apps" / "web" / "package-lock.json").read_text(
                  encoding="utf-8"
              )
          )
          package_names = (
              "brace-expansion",
              "postcss",
              "ip-address",
              "js-yaml",
              "nanoid",
              "undici",
          )
          versions: dict[str, list[str]] = {}
          packages = lock.get("packages", {})
          for name in package_names:
              suffix = f"node_modules/{name}"
              values = {
                  str(metadata.get("version"))
                  for path, metadata in packages.items()
                  if isinstance(path, str)
                  and isinstance(metadata, dict)
                  and (path == suffix or path.endswith(f"/{suffix}"))
              }
              versions[name] = sorted(values)

          lines = [
              "# Frontend dependency security correction — 2026-08-10",
              "",
              "## Baseline",
              "",
              "- feature baseline: `ffdf1faecd98fa29240fed40c9425e2b14aea5d9`;",
              "- version contracts remain `0.1.103`;",
              "- Next.js remains `16.2.11`;",
              "- ESLint remains `9.39.2`;",
              "- no `npm audit fix --force`;",
              "- no application-runtime or marketplace write change.",
              "",
              "## Root cause",
              "",
              "The July security candidate became stale before release. Current registry audit data",
              "added patched floors for brace-expansion, PostCSS, ip-address, js-yaml, nanoid",
              "and undici. The correction updates only those transitive lines and the explicit",
              "PostCSS override while preserving all direct framework/tooling versions.",
              "",
              "## Resolved versions",
              "",
          ]
          for name, values in versions.items():
              lines.append(f"- `{name}`: {', '.join(f'`{value}`' for value in values)};")
          lines.extend(
              [
                  "",
                  "## Verification before commit",
                  "",
                  "- `npm ci`: PASS;",
                  "- `npm ls --all`: PASS;",
                  "- `npm audit --audit-level=high`: PASS;",
                  "- transitive-security regression test: PASS;",
                  "- repository tooling tests: PASS;",
                  "- repository integrity: PASS;",
                  "- frontend unit/design-token tests: PASS;",
                  "- typecheck, lint, design scan, CSS syntax, build and W3C validation: PASS;",
                  f"- validation workflow run: `{os.environ['VALIDATION_RUN_ID']}`.",
                  "",
                  "The repository Quality Gate and container jobs remain authoritative on the",
                  "materialized commit. This evidence contains no credentials or customer data.",
                  "",
              ]
          )
          output = (
              root
              / "DEVELOPMENT_EVIDENCE"
              / "FRONTEND_DEPENDENCY_SECURITY_2026-08-10.md"
          )
          output.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Verify exact final scope and commit materialized candidate
        shell: bash
        env:
          BASE_SHA: ffdf1faecd98fa29240fed40c9425e2b14aea5d9
        run: |
          set -euo pipefail
          git rm -- .github/workflows/security-current-materialize.yml
          git diff --check
          cat > /tmp/expected-paths <<'EOF'
          DEVELOPMENT_EVIDENCE/FRONTEND_DEPENDENCY_SECURITY_2026-08-10.md
          apps/web/package-lock.json
          apps/web/package.json
          scripts/check_integrity.py
          scripts/tests/test_frontend_transitive_security_baseline.py
          scripts/tests/test_postcss_security_baseline.py
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            DEVELOPMENT_EVIDENCE/FRONTEND_DEPENDENCY_SECURITY_2026-08-10.md \
            apps/web/package-lock.json \
            apps/web/package.json \
            scripts/check_integrity.py \
            scripts/tests/test_frontend_transitive_security_baseline.py \
            scripts/tests/test_postcss_security_baseline.py
          git diff --cached --check
          git commit -m 'fix(security): refresh patched frontend dependency lines'
          git push origin HEAD:refs/heads/work/0.1.104-security-current
