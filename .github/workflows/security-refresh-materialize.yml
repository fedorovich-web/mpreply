name: Security refresh materializer

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: security-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/0.1.104-security-refresh' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ffdf1faecd98fa29240fed40c9425e2b14aea5d9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Pin npm toolchain
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Verify security regression tests are RED
        shell: bash
        run: |
          set +e
          python -m unittest discover \
            -s scripts/tests \
            -p 'test_frontend_transitive_security_baseline.py' \
            > /tmp/transitive-red.txt 2>&1
          transitive_status=$?
          python -m unittest discover \
            -s scripts/tests \
            -p 'test_postcss_security_baseline.py' \
            > /tmp/postcss-red.txt 2>&1
          postcss_status=$?
          set -e
          cat /tmp/transitive-red.txt
          cat /tmp/postcss-red.txt
          if [[ "$transitive_status" -eq 0 || "$postcss_status" -eq 0 ]]; then
            echo 'Expected both security regression suites to fail before lockfile remediation.' >&2
            exit 1
          fi

      - name: Integrate security contract into repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/check_integrity.py")
          text = path.read_text(encoding="utf-8")

          import_marker = "import sys\n"
          import_line = (
              "from frontend_transitive_security import "
              "check_frontend_transitive_security\n"
          )
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit("Integrity import marker is missing")
              text = text.replace(import_marker, import_marker + import_line, 1)

          old_postcss = '("overrides", "postcss"): "8.5.18",'
          new_postcss = '("overrides", "postcss"): "8.5.23",'
          if old_postcss not in text:
              raise SystemExit("Integrity PostCSS marker is missing")
          text = text.replace(old_postcss, new_postcss, 1)

          call_marker = "    expected_dependencies = {\n"
          call_line = "    check_frontend_transitive_security(package, lock, fail)\n\n"
          if call_line not in text:
              if call_marker not in text:
                  raise SystemExit("Integrity call marker is missing")
              text = text.replace(call_marker, call_line + call_marker, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Refresh lockfile within declared dependency ranges
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify refreshed dependency graph
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ls --all
          npm audit --audit-level=high

      - name: Verify repository security contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/check_integrity.py

      - name: Run frontend static and build gates
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run test:frontend
          npm run typecheck
          npm run lint
          npm run design:detect
          npm run validate:css-syntax
          npm run build
          npm run validate:w3c

      - name: Verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/security-refresh-materialize.yml
          git diff --check
          cat > /tmp/expected-paths <<'EOF'
          apps/web/package-lock.json
          apps/web/package.json
          scripts/check_integrity.py
          scripts/frontend_transitive_security.py
          scripts/tests/test_frontend_transitive_security_baseline.py
          scripts/tests/test_postcss_security_baseline.py
          EOF
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/web/package-lock.json \
            apps/web/package.json \
            scripts/check_integrity.py \
            scripts/frontend_transitive_security.py \
            scripts/tests/test_frontend_transitive_security_baseline.py \
            scripts/tests/test_postcss_security_baseline.py
          git diff --cached --check
          git commit -m 'fix(security): refresh frontend transitive baseline'
          git push origin "HEAD:refs/heads/${HEAD_REF}"
