name: Quality Gate

on:
    push:
        branches: [main, develop]
    pull_request:
        branches:
            - main
            - develop
            - 'work/**'

concurrency:
    group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: apps/api/pyproject.toml
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - name: Install backend dependencies
              working-directory: apps/api
              run: pip install -e ".[dev]"
            - name: Integrity gate
              run: python scripts/check_integrity.py
            - name: Repository tooling regression tests
              run: python -m unittest discover -s scripts/tests -p "test_*.py"
            - name: Backend import smoke test
              working-directory: apps/api
              run: python -c "import fastapi, pydantic, sqlalchemy, httpx, dramatiq, redis, pytest"
            - name: Dependency consistency
              working-directory: apps/api
              run: python -m pip check
            - name: Ruff
              working-directory: apps/api
              run: ruff check app alembic
            - name: Pyright
              working-directory: apps/api
              run: npx --yes pyright@1.1.411 --pythonpath "$(command -v python)" app
            - name: Tests
              working-directory: apps/api
              run: pytest -q
            - name: Compile Python
              working-directory: apps/api
              run: python -m compileall -q app alembic
            - name: Alembic heads
              working-directory: apps/api
              run: alembic heads

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Complete dependency tree
              working-directory: apps/web
              run: npm ls --all
            - name: Security audit
              working-directory: apps/web
              run: npm audit --audit-level=high
            - name: Frontend unit tests
              working-directory: apps/web
              run: npm run test:unit
            - name: Design token tests
              working-directory: apps/web
              run: npm run test:design-tokens
            - name: Typecheck
              working-directory: apps/web
              run: npm run typecheck
            - name: Lint
              working-directory: apps/web
              run: npm run lint
            - name: Impeccable design anti-pattern scan
              working-directory: apps/web
              run: npm run design:detect
            - name: CSS syntax validation
              working-directory: apps/web
              run: npm run validate:css-syntax
            - name: Build
              working-directory: apps/web
              run: npm run build
            - name: W3C HTML and CSS validation
              working-directory: apps/web
              run: npm run validate:w3c
            - name: Install Playwright Chromium
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Public-site E2E
              working-directory: apps/web
              run: npm run test:e2e
            - name: Accessibility scan
              working-directory: apps/web
              run: npm run test:a11y
            - name: Lighthouse CI
              working-directory: apps/web
              run: npm run lighthouse

    cms:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/cms/package-lock.json
            - name: Install CMS dependencies
              working-directory: apps/cms
              run: npm ci
            - name: CMS dependency tree
              working-directory: apps/cms
              run: npm ls --all
            - name: CMS production dependency audit
              working-directory: apps/cms
              run: npm audit --omit=dev --audit-level=high
            - name: CMS unit tests
              working-directory: apps/cms
              run: npm test
            - name: CMS typecheck
              working-directory: apps/cms
              run: npm run typecheck
            - name: CMS lint
              working-directory: apps/cms
              run: npm run lint
            - name: CMS production build
              working-directory: apps/cms
              run: npm run build

    containers:
        runs-on: ubuntu-latest
        needs: [backend, frontend, cms]
        steps:
            - uses: actions/checkout@v7
            - name: Validate production Compose
              run: docker compose --env-file infra/docker/.env.ci -f infra/docker/docker-compose.production.yml config --quiet
            - name: Build API production image
              run: docker build -f apps/api/Dockerfile apps/api
            - name: Build worker production image
              run: docker build -f apps/worker/Dockerfile .
            - name: Build scheduler production image
              run: docker build -f apps/scheduler/Dockerfile .
            - name: Build web production image
              run: docker build -f apps/web/Dockerfile apps/web
            - name: Build CMS migration image
              run: docker build --target migrator -f apps/cms/Dockerfile apps/cms
            - name: Build CMS production image
              run: docker build --target runner -f apps/cms/Dockerfile apps/cms
