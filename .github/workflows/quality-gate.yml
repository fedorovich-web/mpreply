name: Quality Gate

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: apps/api/pyproject.toml
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - name: Install backend dependencies
              working-directory: apps/api
              run: pip install -e ".[dev]"
            - name: Integrity gate
              run: python scripts/check_integrity.py
            - name: Backend import smoke test
              working-directory: apps/api
              run: python -c "import fastapi, pydantic, sqlalchemy, httpx, dramatiq, redis, pytest"
            - name: Dependency consistency
              working-directory: apps/api
              run: python -m pip check
            - name: Ruff
              working-directory: apps/api
              run: ruff check app alembic
            - name: Pyright
              working-directory: apps/api
              run: npx --yes pyright@1.1.411 --pythonpath "$(command -v python)" app
            - name: Tests
              working-directory: apps/api
              run: pytest -q
            - name: Compile Python
              working-directory: apps/api
              run: python -m compileall -q app alembic
            - name: Alembic heads
              working-directory: apps/api
              run: alembic heads

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Production dependency security audit
              working-directory: apps/web
              run: npm audit --omit=dev --audit-level=high
            - name: Frontend unit tests
              working-directory: apps/web
              run: npm run test:unit
            - name: Design token tests
              working-directory: apps/web
              run: npm run test:design-tokens
            - name: Typecheck
              working-directory: apps/web
              run: npm run typecheck
            - name: Lint
              working-directory: apps/web
              run: npm run lint
            - name: Impeccable design anti-pattern scan
              working-directory: apps/web
              run: npm run design:detect
            - name: CSS syntax validation
              working-directory: apps/web
              run: npm run validate:css-syntax
            - name: Build
              working-directory: apps/web
              run: npm run build
            - name: W3C HTML and CSS validation
              working-directory: apps/web
              run: npm run validate:w3c
            - name: Install Playwright Chromium
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Public-site E2E
              working-directory: apps/web
              run: npm run test:e2e
            - name: Accessibility scan
              working-directory: apps/web
              run: npm run test:a11y
            - name: Lighthouse CI
              working-directory: apps/web
              run: npm run lighthouse

    containers:
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        steps:
            - uses: actions/checkout@v7
            - name: Validate production Compose with CI env file
              run: docker compose --env-file infra/docker/.env.ci -f infra/docker/docker-compose.production.yml config --quiet
            - name: Validate production Compose with explicit env
              env:
                  API_BASE_URL: https://api.respio.example
                  WEB_APP_URL: https://app.respio.example
                  PUBLIC_SITE_URL: https://respio.example
                  DATABASE_URL: postgresql+asyncpg://respio:secret@database:5432/respio
                  REDIS_URL: redis://redis:6379/0
                  AUTH_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
                  GROQ_API_KEY: gsk_ci_placeholder_not_used_123456789
                  CORS_ALLOWED_ORIGINS: '["https://app.respio.example","https://respio.example"]'
                  ALLOWED_HOSTS: '["api.respio.example"]'
                  FORWARDED_ALLOW_IPS: '127.0.0.1'
                  DEPLOYMENT_VERSION: ci
              run: docker compose -f infra/docker/docker-compose.production.yml config --quiet
            - name: Build production images
              run: |
                  docker build -f apps/api/Dockerfile apps/api
                  docker build -f apps/worker/Dockerfile .
                  docker build -f apps/web/Dockerfile apps/web
