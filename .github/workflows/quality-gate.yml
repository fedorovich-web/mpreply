name: Quality Gate

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: apps/api/pyproject.toml
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Install backend dependencies
              working-directory: apps/api
              run: pip install -e ".[dev]"
            - name: Integrity gate
              run: |
                  python -m unittest discover -s scripts/tests
                  python scripts/check_integrity.py
            - name: Backend import smoke test
              working-directory: apps/api
              run: python -c "import fastapi, pydantic, sqlalchemy, httpx, dramatiq, redis, pytest"
            - name: Dependency consistency
              working-directory: apps/api
              run: python -m pip check
            - name: Backend dependency security audit
              working-directory: apps/api
              run: pip-audit --strict .
            - name: Ruff
              working-directory: apps/api
              run: ruff check app alembic
            - name: Pyright
              working-directory: apps/api
              run: npx --yes pyright@1.1.411 --pythonpath "$(command -v python)" app
            - name: Tests
              working-directory: apps/api
              run: pytest -q
            - name: Compile Python
              working-directory: apps/api
              run: python -m compileall -q app alembic
            - name: Alembic heads
              working-directory: apps/api
              run: alembic heads

    postgres-integration:
        name: Backend / PostgreSQL integration
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: mpreply_credit_test_ci
                    POSTGRES_USER: mpreply_local
                    POSTGRES_PASSWORD: mpreply_ci_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mpreply_local -d mpreply_credit_test_ci"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            APP_ENV: local
            DATABASE_URL: postgresql+asyncpg://mpreply_local:mpreply_ci_password@127.0.0.1:5432/mpreply_credit_test_ci
            MPREPLY_CREDIT_TEST_DATABASE_URL: postgresql+asyncpg://mpreply_local:mpreply_ci_password@127.0.0.1:5432/mpreply_credit_test_ci
            MPREPLY_BILLING_TEST_DATABASE_URL: postgresql+asyncpg://mpreply_local:mpreply_ci_password@127.0.0.1:5432/mpreply_credit_test_ci
            AUTH_SECRET_KEY: ci-only-auth-secret-not-for-production-0123456789
            CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: apps/api/pyproject.toml
            - name: Install backend dependencies
              working-directory: apps/api
              run: pip install -e ".[dev]"
            - name: Apply production migrations to isolated PostgreSQL
              working-directory: apps/api
              run: alembic upgrade head
            - name: Run PostgreSQL billing, credits, OAuth and worker tests
              working-directory: apps/api
              run: >-
                  pytest -q
                  app/tests/test_billing_orders_postgres.py
                  app/tests/test_yandex_postgres.py
                  app/tests/test_reply_credits_postgres.py
                  app/tests/test_worker_async_runtime.py

    frontend:
        runs-on: ubuntu-latest
        env:
            NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Production dependency security audit
              working-directory: apps/web
              run: npm audit --omit=dev --audit-level=high
            - name: Frontend unit tests
              working-directory: apps/web
              run: npm run test:unit
            - name: Design token tests
              working-directory: apps/web
              run: npm run test:design-tokens
            - name: Typecheck
              working-directory: apps/web
              run: npm run typecheck
            - name: Lint
              working-directory: apps/web
              run: npm run lint
            - name: CSS syntax validation
              working-directory: apps/web
              run: npm run validate:css-syntax
            - name: Build
              working-directory: apps/web
              run: npm run build
            - name: W3C HTML and CSS validation
              working-directory: apps/web
              run: npm run validate:w3c

    frontend-browser:
        name: Browser / ${{ matrix.suite }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: e2e
                      command: npm run test:e2e
                      production_build: false
                    - suite: visual-security
                      command: npm run test:visual:run && npm run test:security
                      production_build: true
                    - suite: accessibility-lighthouse
                      command: npm run test:a11y && npm run lighthouse
                      production_build: true
        env:
            NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: apps/web/package-lock.json
            - name: Install frontend dependencies
              working-directory: apps/web
              run: npm ci
            - name: Build frontend for production browser checks
              if: matrix.production_build
              working-directory: apps/web
              run: npm run build
            - name: Install Playwright Chromium
              working-directory: apps/web
              run: npx playwright install --with-deps chromium
            - name: Run browser checks
              working-directory: apps/web
              run: ${{ matrix.command }}
            - name: Preserve browser failure diagnostics
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: browser-diagnostics-${{ matrix.suite }}-${{ github.sha }}
                  path: |
                      apps/web/test-results/
                      apps/web/playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

    containers:
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        steps:
            - uses: actions/checkout@v7
            - name: Validate production Compose with CI env file
              run: docker compose --env-file infra/docker/.env.ci -f infra/docker/docker-compose.production.yml config --quiet
            - name: Validate production Compose with explicit env
              env:
                  API_BASE_URL: https://api.respio.example
                  WEB_APP_URL: https://app.respio.example
                  PUBLIC_SITE_URL: https://respio.example
                  DATABASE_URL: postgresql+asyncpg://respio:secret@database:5432/respio
                  REDIS_URL: redis://redis:6379/0
                  AUTH_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                  CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
                  RESEND_API_KEY: re_ci_placeholder_not_used_123456789
                  GROQ_API_KEY: gsk_ci_placeholder_not_used_123456789
                  CORS_ALLOWED_ORIGINS: '["https://app.respio.example","https://respio.example"]'
                  ALLOWED_HOSTS: '["api.respio.example"]'
                  FORWARDED_ALLOW_IPS: '127.0.0.1'
                  DEPLOYMENT_VERSION: ci
              run: docker compose -f infra/docker/docker-compose.production.yml config --quiet
            - name: Build production images
              run: |
                  docker build -f apps/api/Dockerfile apps/api
                  docker build -f apps/worker/Dockerfile .
                  docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -f apps/web/Dockerfile apps/web
