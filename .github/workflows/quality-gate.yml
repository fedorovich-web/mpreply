name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Integrity gate
        run: python scripts/check_integrity.py
      - name: Backend import smoke test
        working-directory: apps/api
        run: python -c "import fastapi, pydantic, sqlalchemy, httpx, dramatiq, redis, pytest"
      - name: Dependency consistency
        working-directory: apps/api
        run: python -m pip check
      - name: Ruff
        working-directory: apps/api
        run: ruff check app alembic
      - name: Pyright
        working-directory: apps/api
        run: npx --yes pyright@1.1.411 --pythonpath "$(command -v python)" app
      - name: Tests
        working-directory: apps/api
        run: pytest -q
      - name: Compile Python
        working-directory: apps/api
        run: python -m compileall -q app alembic
      - name: Alembic heads
        working-directory: apps/api
        run: alembic heads

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Security audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Build
        working-directory: apps/web
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate local Compose
        run: docker compose -f infra/docker/docker-compose.local.yml config --quiet
      - name: Validate production Compose
        env:
          API_BASE_URL: https://api.respio.example
          WEB_APP_URL: https://app.respio.example
          PUBLIC_SITE_URL: https://respio.example
          DATABASE_URL: postgresql+asyncpg://respio:secret@database:5432/respio
          REDIS_URL: redis://redis:6379/0
          AUTH_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CREDENTIALS_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          OPENROUTER_API_KEY: sk-or-v1-ci-placeholder-not-used
          CORS_ALLOWED_ORIGINS: '["https://app.respio.example","https://respio.example"]'
          ALLOWED_HOSTS: '["api.respio.example"]'
          DEPLOYMENT_VERSION: ci
        run: docker compose -f infra/docker/docker-compose.production.yml config --quiet
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile apps/api
          docker build -f apps/worker/Dockerfile .
          docker build -f apps/web/Dockerfile apps/web
